name: Add a server
description: For when you don't want to do a PR
title: "Server: "
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: Address
      placeholder: play.example.net
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Short description
      placeholder: Survival, Skyblock and more
  - type: input
    id: languages
    attributes:
      label: Languages
      placeholder: de, en
  - type: textarea
    id: banner
    attributes:
      label: Banner
      description: Drop it in here. 480x232 or 960x464, max 300 KB
    validations:
      required: true
  - type: checkboxes
    id: owner
    attributes:
      label: Permission
      options:
        - label: it's my server or I'm allowed to add it
          required: true
